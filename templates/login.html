{% extends "base.html" %}

{% block content %}

<div class="form-container">

    <h2>Login</h2>

    <p>
        Login to access your account.
    </p>


    <form method="POST">

        <!-- CSRF protection -->

        <input type="hidden"
               name="csrf_token"
               value="{{ csrf_token }}">


        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter username"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            required
        >


        <button type="submit">
            Login
        </button>

    </form>


    <p>

        Don't have an account?

        <a href="{{ url_for('register') }}">
            Register
        </a>

    </p>

</div>

{% endblock %}
