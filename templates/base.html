<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Secure Login System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="navbar">

    <div class="logo">
        Secure Login System
    </div>

    <div class="nav-links">

        <a href="{{ url_for('index') }}">
            Home
        </a>

        {% if session.get('user_id') %}

            <a href="{{ url_for('dashboard') }}">
                Dashboard
            </a>

            <form method="POST"
                  action="{{ url_for('logout') }}"
                  class="inline-form">

                <input type="hidden"
                       name="csrf_token"
                       value="{{ csrf_token }}">

                <button type="submit"
                        class="nav-button">
                    Logout
                </button>

            </form>

        {% else %}

            <a href="{{ url_for('login') }}">
                Login
            </a>

            <a href="{{ url_for('register') }}">
                Register
            </a>

        {% endif %}

    </div>

</nav>


<main class="container">

    {% with messages = get_flashed_messages() %}

        {% if messages %}

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    {% block content %}

    {% endblock %}

</main>

</body>

</html>
